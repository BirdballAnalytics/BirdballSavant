name: Build and publish BirdballSavant

# Rebuilds the site whenever data (or the site itself) changes on main,
# and can also be run by hand from the Actions tab.
on:
  push:
    branches: [main]
    paths:
      - "data/**"
      - "site/**"
      - "scripts/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:
    inputs:
      pull_ncaa:
        description: "Also refresh TruMedia NCAA stats (slower; it runs every Monday anyway)"
        type: boolean
        default: false
  schedule:
    - cron: "17 9 * * 1"   # every Monday morning: refresh TruMedia data

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Restore last TruMedia pull
        uses: actions/cache/restore@v4
        with:
          path: site/data/ncaa-*.json
          key: trumedia-${{ github.run_id }}
          restore-keys: trumedia-

      - name: Pull TruMedia NCAA data
        if: github.event_name == 'schedule' || inputs.pull_ncaa || contains(github.event.head_commit.modified, 'scripts/trumedia.json') || contains(github.event.head_commit.added, 'scripts/trumedia.json')
        timeout-minutes: 40
        continue-on-error: true
        env:
          TRUMEDIA_USERNAME: ${{ secrets.TRUMEDIA_USERNAME }}
          TRUMEDIA_SITENAME: ${{ secrets.TRUMEDIA_SITENAME }}
          TRUMEDIA_MASTER_TOKEN: ${{ secrets.TRUMEDIA_MASTER_TOKEN }}
        run: python scripts/trumedia.py

      - name: Save TruMedia pull for next time
        uses: actions/cache/save@v4
        if: always() && hashFiles('site/data/ncaa-*.json') != ''
        continue-on-error: true
        with:
          path: site/data/ncaa-*.json
          key: trumedia-${{ github.run_id }}

      - name: Restore TruMedia video links
        uses: actions/cache/restore@v4
        with:
          path: site/data/video-tm
          key: video-${{ github.run_id }}
          restore-keys: video-

      - name: Pull AWRE game video links from TruMedia
        timeout-minutes: 15
        continue-on-error: true
        env:
          TRUMEDIA_USERNAME: ${{ secrets.TRUMEDIA_USERNAME }}
          TRUMEDIA_SITENAME: ${{ secrets.TRUMEDIA_SITENAME }}
          TRUMEDIA_MASTER_TOKEN: ${{ secrets.TRUMEDIA_MASTER_TOKEN }}
        run: python scripts/video_pull.py

      - name: Save TruMedia video links for next time
        uses: actions/cache/save@v4
        if: always() && hashFiles('site/data/video-tm/*.json') != ''
        continue-on-error: true
        with:
          path: site/data/video-tm
          key: video-${{ github.run_id }}

      - name: Build data files from everything in data/
        run: python scripts/build.py

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
