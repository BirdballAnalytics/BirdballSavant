name: Build and publish BirdballSavant

# Rebuilds the site whenever data (or the site itself) changes on main. It never contacts
# TruMedia: it uses the TruMedia data saved by the "Pull TruMedia data" workflow, so an upload
# is live in a few minutes. That workflow starts this one again whenever it pulls new data.
on:
  push:
    branches: [main]
    paths:
      - "data/**"
      - "site/**"
      - "scripts/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Restore saved TruMedia data
        uses: actions/cache/restore@v4
        with:
          path: site/data/ncaa-*.json
          key: trumedia-${{ github.run_id }}
          restore-keys: trumedia-

      - name: Restore saved video links
        uses: actions/cache/restore@v4
        with:
          path: site/data/video-tm
          key: video-${{ github.run_id }}
          restore-keys: video-

      - name: Restore saved AWRE video
        uses: actions/cache/restore@v4
        with:
          path: |
            site/data/video-awre
            site/data/video-awre-report.json
          key: awre-${{ github.run_id }}
          restore-keys: awre-

      - name: Rebuild NCAA pages from saved TruMedia data (no TruMedia calls)
        continue-on-error: true
        env:
          TRUMEDIA_MODE: offline
        run: python scripts/trumedia.py

      - name: Build data files from everything in data/
        run: python scripts/build.py

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
