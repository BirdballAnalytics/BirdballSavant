name: Build and publish BirdballSavant

# Rebuilds the site whenever data (or the site itself) changes on main. It never contacts
# TruMedia: it uses the TruMedia data saved by the "Pull TruMedia data" workflow, so an upload
# is live in a few minutes. That workflow starts this one again whenever it pulls new data.
on:
  push:
    branches: [main]
    paths:
      - "data/**"
      - "site/**"
      - "scripts/**"
      - "plans/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:
  # Picks up PDFs added to a private plans repository (see README, "Development plans").
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    # the hourly run only matters when plans live in a private repository
    if: ${{ github.event_name != 'schedule' || vars.PLANS_REPO != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Restore saved TruMedia data
        uses: actions/cache/restore@v4
        with:
          path: site/data/ncaa-*.json
          key: trumedia-${{ github.run_id }}
          restore-keys: trumedia-

      - name: Restore saved video links
        uses: actions/cache/restore@v4
        with:
          path: site/data/video-tm
          key: video-${{ github.run_id }}
          restore-keys: video-

      - name: Restore saved AWRE video
        uses: actions/cache/restore@v4
        with:
          path: |
            site/data/video-awre
            site/data/video-awre-report.json
          key: awre-${{ github.run_id }}
          restore-keys: awre-

      - name: Rebuild NCAA pages from saved TruMedia data (no TruMedia calls)
        continue-on-error: true
        env:
          TRUMEDIA_MODE: offline
        run: python scripts/trumedia.py

      - name: Build data files from everything in data/
        run: python scripts/build.py

      - name: Get development plans from the private plans repository (if set up)
        if: ${{ vars.PLANS_REPO != '' }}
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.PLANS_REPO }}
          token: ${{ secrets.PLANS_TOKEN }}
          path: plans-private
          fetch-depth: 0

      - name: History for plans/ dates (when a PDF was added)
        if: ${{ vars.PLANS_REPO == '' }}
        continue-on-error: true
        run: git fetch --quiet --unshallow --filter=blob:none origin || true

      - name: Publish development plans (locked with each player's code)
        continue-on-error: true
        env:
          PLANS_SECRET: ${{ secrets.PLANS_SECRET }}
          PLANS_UPLOAD_URL: ${{ vars.PLANS_REPO != '' && format('https://github.com/{0}/upload/main', vars.PLANS_REPO) || format('https://github.com/{0}/upload/main/plans', github.repository) }}
          PLANS_PUBLISH_URL: https://github.com/${{ github.repository }}/actions/workflows/deploy.yml
        run: python scripts/plans.py

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
