<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BirdballSavant</title>
<meta name="description" content="Boston College Baseball TrackMan data: leaderboards, player pages, pitch arsenals and batted-ball metrics.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#8c2232">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="BirdballSavant">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Public+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap">
<link rel="stylesheet" href="app.css">
<script>
  // Dark is the default; a saved choice from the footer toggle wins.
  // Saved to the home screen (or ?app=1 for testing): show the bottom tab bar
  try { if (window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true || /[?&]app=1/.test(location.search)) document.documentElement.classList.add('standalone'); } catch (e) {}
  try { var t = localStorage.getItem('bbs:theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; else document.documentElement.dataset.theme = 'dark'; } catch (e) { document.documentElement.dataset.theme = 'dark'; }
</script>
</head>
<body>
<header class="topbar">
  <div class="wrap topbar-in">
    <a class="brand" href="#home" aria-label="BirdballSavant home">
      <span class="brand-a">Birdball</span><span class="brand-b">Savant</span>
    </a>
    <nav class="nav" id="nav" aria-label="Main">
      <a href="#hitting" data-nav="hitting" class="in-tabs">Hitting</a>
      <a href="#pitching" data-nav="pitching" class="in-tabs">Pitching</a>
      <a href="#arsenal" data-nav="arsenal">Arsenals</a>
      <a href="#spray" data-nav="spray">Spray Chart</a>
      <a href="#games" data-nav="games">Games</a>
      <a href="#search" data-nav="search">Search</a>
      <a href="#ncaa" data-nav="ncaa" id="nav-ncaa" hidden>NCAA</a>
      <a href="#video" data-nav="video" id="nav-video" class="in-tabs" hidden>Video</a>
      <a href="#glossary" data-nav="glossary">Glossary</a>
    </nav>
    <div class="psearch">
      <label class="sr" for="psearch-input">Find a player</label>
      <input id="psearch-input" type="search" placeholder="Find a player" autocomplete="off">
      <div class="psearch-list" id="psearch-list" hidden></div>
    </div>
  </div>
</header>
<nav id="subnav" class="wrap subnav" aria-label="Section" hidden></nav>
<main id="app" class="wrap" aria-live="polite">
  <div class="loading">Loading TrackMan data…</div>
</main>
<nav class="tabbar" id="tabbar" aria-label="App tabs">
  <a href="#home" data-tab="home"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg><span>Home</span></a>
  <a href="#hitting" data-tab="hitting"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 3.5c-.8-.8-2-.7-2.8.1L7.4 14.2l2.4 2.4L20.4 6.3c.8-.8.9-2 .1-2.8z"/><path d="m7.4 14.2-3.6 4 2 2 4-3.6"/><circle cx="6" cy="7" r="2.4"/></svg><span>Hitting</span></a>
  <a href="#pitching" data-tab="pitching"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M7.2 5.2c1.7 1.9 2.6 4.3 2.6 6.8s-.9 4.9-2.6 6.8M16.8 5.2c-1.7 1.9-2.6 4.3-2.6 6.8s.9 4.9 2.6 6.8"/></svg><span>Pitching</span></a>
  <a href="#video" data-tab="video"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="m10 9 5 3-5 3z"/></svg><span>Video</span></a>
  <a href="#profile" data-tab="profile"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c.8-4 4-6 8-6s7.2 2 8 6"/></svg><span>Profile</span></a>
</nav>
<footer class="foot wrap">
  <span>BirdballSavant · Boston College Baseball</span>
  <span class="foot-r"><button type="button" class="linkbtn" id="theme-btn">Light mode</button><a href="#data" id="foot-built">Data status</a></span>
</footer>
<script src="app.js"></script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
  }
</script>
</body>
</html>
